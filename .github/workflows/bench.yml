name: Bench

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
    paths-ignore: ["README.md"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: write

concurrency:
  group: bench-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-latest
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
          - platform: windows-x64
            runner: windows-latest
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p quantadb-server -p quantadb-bench
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.platform }}
          path: |
            target/release/quantadb-server*
            target/release/loadgen*
            !target/release/*.d
            !target/release/*.pdb
          if-no-files-found: error

  bench:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: linux-x64-full
            runner: ubuntu-latest
            platform: linux-x64
            mode: native
          - profile: linux-x64-2cpu-2gb
            runner: ubuntu-latest
            platform: linux-x64
            mode: docker
            cpus: "2"
            memory: 2g
          - profile: linux-x64-1cpu-1gb
            runner: ubuntu-latest
            platform: linux-x64
            mode: docker
            cpus: "1"
            memory: 1g
          - profile: linux-arm64-full
            runner: ubuntu-24.04-arm
            platform: linux-arm64
            mode: native
          - profile: windows-x64-full
            runner: windows-latest
            platform: windows-x64
            mode: native
    name: Bench ${{ matrix.profile }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bin-${{ matrix.platform }}
          path: bin
      - name: Fetch baseline binaries
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow bench.yml \
            --branch main --status success --limit 1 --json databaseId \
            -q '.[0].databaseId' || true)
          if [ -z "$run" ]; then
            echo "no baseline build to pair against"
            exit 0
          fi
          gh run download "$run" --repo "$GITHUB_REPOSITORY" \
            --name bin-${{ matrix.platform }} --dir bin-base || \
            echo "baseline binaries expired"
      - name: Start server
        shell: bash
        run: |
          chmod +x bin/* 2>/dev/null || true
          mkdir -p "$RUNNER_TEMP/qdata"
          if [ "${{ matrix.mode }}" = "docker" ]; then
            docker run -d --name qserver \
              --cpus ${{ matrix.cpus }} --memory ${{ matrix.memory }} \
              -p 54321:54321 \
              -e QUANTA_DATA_DIR=/data \
              -e QUANTA_LISTEN_ADDRESS=0.0.0.0:54321 \
              -e QUANTA_PG_LISTEN_ADDRESS=off \
              -e QUANTA_HTTP_LISTEN_ADDRESS=off \
              -v "$RUNNER_TEMP/qdata:/data" \
              -v "$PWD/bin:/app:ro" \
              ubuntu:24.04 /app/quantadb-server
          else
            server=bin/quantadb-server
            [ -f "$server" ] || server=bin/quantadb-server.exe
            QUANTA_DATA_DIR="$RUNNER_TEMP/qdata" \
            QUANTA_PG_LISTEN_ADDRESS=off \
            QUANTA_HTTP_LISTEN_ADDRESS=off \
            "$server" &
          fi
          for _ in $(seq 1 60); do
            if (exec 3<>/dev/tcp/127.0.0.1/54321) 2>/dev/null; then
              exec 3>&- || true
              sleep 2
              exit 0
            fi
            sleep 1
          done
          echo "server never came up"
          if [ "${{ matrix.mode }}" = "docker" ]; then docker logs qserver; fi
          exit 1
      - name: Start baseline server
        if: github.event_name == 'pull_request' && matrix.mode == 'native'
        shell: bash
        run: |
          base=bin-base/quantadb-server
          [ -f "$base" ] || base=bin-base/quantadb-server.exe
          if [ ! -f "$base" ]; then
            echo "no baseline binary; this run reports absolute numbers only"
            exit 0
          fi
          chmod +x bin-base/* 2>/dev/null || true
          mkdir -p "$RUNNER_TEMP/qbase"
          QUANTA_DATA_DIR="$RUNNER_TEMP/qbase" \
          QUANTA_LISTEN_ADDRESS=127.0.0.1:54322 \
          QUANTA_PG_LISTEN_ADDRESS=off \
          QUANTA_HTTP_LISTEN_ADDRESS=off \
          "$base" &
          for _ in $(seq 1 60); do
            if (exec 3<>/dev/tcp/127.0.0.1/54322) 2>/dev/null; then
              exec 3>&- || true
              sleep 2
              baseloadgen=bin-base/loadgen
              [ -f "$baseloadgen" ] || baseloadgen=bin-base/loadgen.exe
              echo "BASE_SERVER=1" >> "$GITHUB_ENV"
              echo "BASE_LOADGEN=$baseloadgen" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 1
          done
          echo "baseline server never came up; reporting absolute numbers only"
      - name: Run workloads
        shell: bash
        run: |
          loadgen=bin/loadgen
          [ -f "$loadgen" ] || loadgen=bin/loadgen.exe
          # Runner speed varies far more between jobs than between passes, so
          # both builds run here, interleaved, and are compared to each other.
          run_pass() {
            for attempt in 1 2 3; do
              "$loadgen" --seconds 10 --connections 4 --rows 5000 --read-percent "$2" > pass.txt
              cat pass.txt
              python .github/scripts/parse_loadgen.py "$1" pass.txt >> "${{ matrix.profile }}.jsonl"
              if [ -n "$BASE_SERVER" ]; then
                "$BASE_LOADGEN" --seconds 10 --connections 4 --rows 5000 \
                  --read-percent "$2" --address 127.0.0.1:54322 > base.txt
                python .github/scripts/parse_loadgen.py "$1" base.txt \
                  >> "baseline-${{ matrix.profile }}.jsonl"
              fi
            done
          }
          run_pass reads 100
          run_pass mixed 80
          run_pass writes 0
      - name: Server diagnostics
        if: failure()
        shell: bash
        run: |
          if [ "${{ matrix.mode }}" = "docker" ]; then
            docker ps -a
            docker logs qserver || true
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: result-${{ matrix.profile }}
          path: ${{ matrix.profile }}.jsonl
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: hashFiles(format('baseline-{0}.jsonl', matrix.profile)) != ''
        with:
          name: paired-${{ matrix.profile }}
          path: baseline-${{ matrix.profile }}.jsonl
          if-no-files-found: ignore

  report:
    needs: bench
    name: Report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: result-*
          path: results
      - uses: actions/download-artifact@v4
        with:
          pattern: paired-*
          path: paired
      - name: Fetch baseline from main
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow bench.yml \
            --branch main --status success --limit 1 \
            --json databaseId,headSha -q '.[0]' || true)
          if [ -z "$run" ] || [ "$run" = "null" ]; then
            echo "no baseline run on main yet"
            exit 0
          fi
          run_id=$(echo "$run" | python -c "import json,sys; print(json.load(sys.stdin)['databaseId'])")
          echo "$run" | python -c "import json,sys; print(json.load(sys.stdin)['headSha'])" > baseline-sha.txt
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" \
            --pattern 'result-*' --dir baseline || echo "baseline artifacts expired"
      - name: Fetch field reference
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow reference.yml \
            --status success --limit 1 \
            --json databaseId,headSha,updatedAt -q '.[0]' || true)
          if [ -z "$run" ] || [ "$run" = "null" ]; then
            echo "no reference run yet"
            exit 0
          fi
          run_id=$(echo "$run" | python -c "import json,sys; print(json.load(sys.stdin)['databaseId'])")
          echo "$run" | python -c "
          import json, sys
          data = json.load(sys.stdin)
          print(data['updatedAt'][:10], '@', data['headSha'][:9])
          " > reference-stamp.txt
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" \
            --pattern 'reference-*' --dir reference || echo "reference artifacts expired"
      - name: Build report
        shell: bash
        run: |
          sha=$(cat baseline-sha.txt 2>/dev/null || echo "")
          stamp=$(cat reference-stamp.txt 2>/dev/null || echo "never")
          # A baseline measured on the same runner beats one from another job.
          if [ -n "$(ls paired 2>/dev/null)" ]; then
            rm -rf baseline && mv paired baseline
            sha="same runner"
          fi
          python .github/scripts/bench_report.py results baseline comment.md "$sha" reference "$stamp"
          cat comment.md >> "$GITHUB_STEP_SUMMARY"
      - name: Post sticky comment
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          existing=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            -q '.[] | select(.body | startswith("<!-- quantadb-bench-report -->")) | .id' | head -1)
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing" -F body=@comment.md >/dev/null
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F body=@comment.md >/dev/null
          fi

  publish-readme:
    needs: report
    if: github.event_name == 'push'
    name: Publish README numbers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: result-*
          path: results
      - name: Fetch field reference
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow reference.yml \
            --status success --limit 1 \
            --json databaseId,updatedAt -q '.[0]' || true)
          if [ -z "$run" ] || [ "$run" = "null" ]; then
            exit 0
          fi
          run_id=$(echo "$run" | python -c "import json,sys; print(json.load(sys.stdin)['databaseId'])")
          echo "$run" | python -c "import json,sys; print(json.load(sys.stdin)['updatedAt'][:10])" > reference-stamp.txt
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" \
            --pattern 'reference-*' --dir reference || true
      - name: Rewrite the bench section
        run: |
          stamp=$(cat reference-stamp.txt 2>/dev/null || echo "never")
          python .github/scripts/readme_bench.py results reference "$stamp" "$GITHUB_SHA"
      - name: Commit if changed
        run: |
          if git diff --quiet README.md; then
            echo "README already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Refresh README bench numbers [skip ci]"
          git push
